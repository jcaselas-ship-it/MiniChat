<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniChat</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#15171c">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style id="estilos">
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,Segoe UI,sans-serif;background:var(--bg,#15171c);color:var(--fg,#e8e8e8)}
#app{display:flex;flex-direction:column;height:100vh;max-width:640px;margin:0 auto}
.pip #app{max-width:none}
#setup{margin:auto;padding:20px;display:flex;flex-direction:column;gap:10px;width:min(340px,90%)}
#setup h1{margin:0 0 6px;font-size:20px;text-align:center}
input,button{font:inherit;border-radius:8px;border:1px solid var(--borde);padding:9px 11px;background:var(--panel);color:var(--fg)}
button{cursor:pointer;background:#2f6fde;border-color:#2f6fde;color:#fff}
button.sec{background:var(--panel);border-color:var(--borde);color:var(--fg)}
.nota{font-size:12px;color:var(--muted)}
#chat{display:none;flex-direction:column;height:100%}
#cab{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--borde)}
#estado{flex:1;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cab button{padding:4px 9px;font-size:12px}
#ajustes{display:none;flex-direction:column;gap:8px;padding:8px 10px;border-bottom:1px solid var(--borde);background:var(--panel);font-size:13px}
#ajustes.abierto{display:flex}
#ajustes label{display:flex;align-items:center;gap:8px}
#ajustes input[type=range]{flex:1;padding:0}
.fila{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.muestra{width:24px;height:24px;border-radius:50%;padding:0;border:2px solid transparent}
.muestra.sel{border-color:var(--fg)}
.tema{padding:4px 9px;font-size:12px;background:var(--bg);color:var(--fg);border-color:var(--borde)}
.tema.sel{outline:2px solid #2f6fde}
#msgs{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:5px}
.m{max-width:85%;padding:6px 9px;border-radius:10px;background:var(--otro);border-left:3px solid transparent;word-wrap:break-word;white-space:pre-wrap;font-size:var(--fs,15px)}
.m.yo{align-self:flex-end;color:#fff;border-left:none}
.m b{font-size:.75em;display:block}
.m.yo b{color:#ffffffcc}
.m i{font-size:.7em;opacity:.7;font-style:normal;margin-left:6px}
.sis{align-self:center;font-size:11px;color:var(--muted)}
#pie{display:flex;gap:6px;padding:8px;border-top:1px solid var(--borde)}
#txt{flex:1;font-size:var(--fs,15px)}
#aviso{display:none;margin:auto;color:var(--muted)}
#pie .ic{padding:9px 10px;background:var(--panel);border-color:var(--borde);color:var(--fg);touch-action:none;user-select:none;-webkit-user-select:none}
#mic.rec{background:#d64545;border-color:#d64545;color:#fff}
.m img{display:block;max-width:220px;max-height:220px;border-radius:8px;margin-top:4px;cursor:zoom-in}
.m audio{display:block;width:230px;max-width:100%;margin-top:4px}
.m a.arch{display:inline-block;margin-top:4px;padding:6px 10px;border-radius:8px;background:#0003;color:inherit;text-decoration:none}
.m .prog{font-size:.8em;opacity:.8}
</style>
</head>
<body>
<div id="aviso">El chat está en la ventana flotante.</div>
<div id="app">
  <div id="setup">
    <h1>MiniChat</h1>
    <input id="nick" placeholder="Tu nombre" maxlength="20">
    <input id="frase" placeholder="Frase secreta de la sala" type="password">
    <button id="entrar">Entrar</button>
    <div class="nota" id="nota">Todos deben usar la misma frase. Máx 6 personas.</div>
  </div>
  <div id="chat">
    <div id="cab">
      <span id="estado">Conectando…</span>
      <button id="ajustesBtn" class="sec" title="Ajustes">⚙</button>
      <button id="flotar" class="sec">Flotar</button>
      <button id="salir" class="sec">Salir</button>
    </div>
    <div id="ajustes">
      <label>Letra <input type="range" id="fs" min="12" max="26" step="1"> <span id="fsVal"></span></label>
      <div class="fila">Mi color <span id="colores" class="fila"></span></div>
      <div class="fila">Tema <span id="temas" class="fila"></span></div>
    </div>
    <div id="msgs"></div>
    <div id="pie">
      <button id="clip" class="ic" title="Enviar foto, PDF o audio (máx. 10 MB)">📎</button>
      <input id="file" type="file" accept="image/*,application/pdf,audio/*" hidden>
      <input id="txt" placeholder="Escribe y pulsa Enter" autocomplete="off">
      <button id="mic" class="ic" title="Mantén pulsado para grabar una nota de voz">🎤</button>
      <button id="enviar">➤</button>
    </div>
  </div>
</div>
<script>
const MAX = 6;
const $ = id => document.getElementById(id);
const el = {};
['app','setup','chat','nick','frase','entrar','nota','estado','flotar','salir','msgs','txt','enviar','aviso','estilos','ajustesBtn','ajustes','fs','fsVal','colores','temas'].forEach(k => el[k] = $(k));

let peer = null, mySlot = 0, base = '', authTok = '', nick = '', histKey = '', scan = null;
let pipWin = null, unread = 0, audio = null;
const conns = new Map();       // peerId -> {conn, nick, ok}
const anunciados = new Set();  // peers ya anunciados como conectados

async function sha(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}

// ---------- Entrar / salir ----------
async function entrar() {
  nick = el.nick.value.trim();
  const frase = el.frase.value.trim();
  if (!nick || frase.length < 6) { el.nota.textContent = 'Pon un nombre y una frase de al menos 6 caracteres.'; return; }
  localStorage.setItem('ca_nick', nick);
  localStorage.setItem('ca_frase', frase);
  const h = await sha('chatamigos|' + frase);
  base = 'ca-' + h.slice(0, 24);
  authTok = (await sha('auth|' + frase)).slice(0, 32);
  histKey = 'ca_hist_' + h.slice(0, 12);
  el.setup.style.display = 'none';
  el.chat.style.display = 'flex';
  cargarHistorial();
  reclamarSlot(1);
  el.txt.focus();
}

function salir() {
  clearInterval(scan);
  if (peer) peer.destroy();
  peer = null; conns.clear(); anunciados.clear();
  localStorage.removeItem('ca_frase');
  el.frase.value = '';
  el.msgs.innerHTML = '';
  if (pipWin) pipWin.close();
  el.chat.style.display = 'none';
  el.setup.style.display = 'flex';
}

// ---------- Conexión ----------
function reclamarSlot(k) {
  if (k > MAX) { estado('Sala llena (máximo ' + MAX + ')'); return; }
  const p = new Peer(base + '-' + k);
  p.on('open', () => {
    peer = p; mySlot = k;
    actualizar();
    conectarTodos();
    clearInterval(scan);
    scan = setInterval(conectarTodos, 20000);
  });
  p.on('error', e => {
    if (e.type === 'unavailable-id') { p.destroy(); reclamarSlot(k + 1); return; }
    if (e.type === 'peer-unavailable') return; // ese hueco está vacío: normal
    estado('Error: ' + e.type);
  });
  p.on('connection', c => prepararConn(c, c.peer));
  p.on('disconnected', () => { if (!p.destroyed) p.reconnect(); });
}

function conectarTodos() {
  if (!peer || peer.destroyed) return;
  for (let j = 1; j <= MAX; j++) {
    if (j === mySlot) continue;
    const id = base + '-' + j;
    if (conns.has(id)) continue;
    prepararConn(peer.connect(id, { reliable: true }), peer.id);
  }
}

function prepararConn(c, iniciador) {
  const r = c.peer;
  c._ini = iniciador;
  const prev = conns.get(r);
  if (prev) {
    // Conexión duplicada: ambos lados conservan la que inició el ID menor
    if (c._ini < prev.conn._ini) prev.conn.close();
    else { c.close(); return; }
  }
  conns.set(r, { conn: c, nick: '?', ok: false });
  setTimeout(() => {
    if (!c.open) { c.close(); if (conns.get(r)?.conn === c) conns.delete(r); }
  }, 10000);
  c.on('open', () => c.send({ t: 'hola', auth: authTok, nick, color: ajustes.color }));
  c.on('data', d => recibir(c, d));
  c.on('close', () => {
    const e = conns.get(r);
    if (e && e.conn === c) {
      conns.delete(r);
      if (anunciados.delete(r)) sistema(e.nick + ' se ha desconectado');
      actualizar();
    }
  });
  c.on('error', () => {});
}

function recibir(c, d) {
  const e = conns.get(c.peer);
  if (!e || e.conn !== c || !d || typeof d !== 'object') return;
  if (d.t === 'hola') {
    if (d.auth !== authTok) { c.close(); return; }   // no conoce la frase
    e.ok = true;
    e.nick = String(d.nick || '?').slice(0, 20);
    e.color = colorValido(d.color);
    if (!anunciados.has(c.peer)) { anunciados.add(c.peer); sistema(e.nick + ' se ha conectado'); }
    actualizar();
    return;
  }
  if (!e.ok) return;
  if (d.t === 'f0' || d.t === 'fc' || d.t === 'f1') { recibirArchivo(c, e, d); return; }
  if (d.t === 'msg') {
    anadir({ from: e.nick, color: colorValido(d.color) || e.color, text: String(d.text || '').slice(0, 2000), ts: Date.now() }, true);
    avisar();
  }
}

function enviar() {
  const t = el.txt.value.trim();
  if (!t) return;
  let n = 0;
  for (const e of conns.values()) if (e.ok && e.conn.open) { e.conn.send({ t: 'msg', text: t, color: ajustes.color }); n++; }
  anadir({ from: nick, text: t, ts: Date.now(), yo: true, color: ajustes.color }, true);
  el.txt.value = '';
  if (!n) sistema('No hay nadie conectado: el mensaje no se ha entregado');
}

// ---------- Interfaz ----------
function estado(s) { el.estado.textContent = s; }
function actualizar() {
  const nombres = [...conns.values()].filter(e => e.ok).map(e => e.nick);
  estado(nombres.length ? '🟢 ' + nombres.join(', ') : '⚪ Esperando a tus amigos…');
}

function hora(ts) { return new Date(ts).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }); }

function pintar(m, extra) {
  const d = document.createElement('div');
  d.className = 'm' + (m.yo ? ' yo' : '');
  const b = document.createElement('b');
  b.textContent = m.yo ? 'Tú' : m.from;
  const col = colorValido(m.color) || '#2f6fde';
  if (m.yo) d.style.background = col;
  else { d.style.borderLeftColor = col; b.style.color = col; }
  const i = document.createElement('i');
  i.textContent = hora(m.ts);
  b.append(i);
  d.append(b, document.createTextNode(m.text));
  if (extra) d.append(extra);
  el.msgs.append(d);
  el.msgs.scrollTop = el.msgs.scrollHeight;
  return d;
}

function anadir(m, guardar) {
  if (guardar !== 'solo') pintar(m);
  if (!guardar) return;
  try {
    const h = JSON.parse(localStorage.getItem(histKey) || '[]');
    h.push(m);
    localStorage.setItem(histKey, JSON.stringify(h.slice(-300)));
  } catch (_) {}
}

function cargarHistorial() {
  el.msgs.innerHTML = '';
  try { JSON.parse(localStorage.getItem(histKey) || '[]').forEach(pintar); } catch (_) {}
}

function sistema(s) {
  const d = document.createElement('div');
  d.className = 'sis';
  d.textContent = s;
  el.msgs.append(d);
  el.msgs.scrollTop = el.msgs.scrollHeight;
}

function avisar() {
  const enfocado = document.hasFocus() || (pipWin && pipWin.document.hasFocus());
  if (enfocado) return;
  unread++;
  document.title = '(' + unread + ') MiniChat';
  try {
    audio = audio || new AudioContext();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = 880; g.gain.value = 0.08;
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + 0.12);
  } catch (_) {}
}
function leido() { unread = 0; document.title = 'MiniChat'; }
window.addEventListener('focus', leido);

// ---------- Ventana flotante ----------
async function flotar() {
  if (pipWin) { pipWin.close(); return; }
  if (!('documentPictureInPicture' in window)) {
    sistema('Tu navegador no permite ventana flotante. Usa Chrome o Edge de ordenador.');
    return;
  }
  pipWin = await documentPictureInPicture.requestWindow({ width: 340, height: 480 });
  pipWin.document.title = 'MiniChat';
  pipWin.document.head.append(el.estilos.cloneNode(true));
  pipWin.document.body.classList.add('pip');
  aplicarAjustes();
  pipWin.document.body.append(el.app);
  pipWin.addEventListener('focus', leido);
  el.aviso.style.display = 'block';
  el.flotar.textContent = 'Volver';
  el.msgs.scrollTop = el.msgs.scrollHeight;
  pipWin.addEventListener('pagehide', () => {
    document.body.append(el.app);
    el.aviso.style.display = 'none';
    el.flotar.textContent = 'Flotar';
    pipWin = null;
  });
}


// ---------- Archivos y notas de voz (directos entre amigos, sin servidor) ----------
const MAX_FILE = 10 * 1024 * 1024, CHUNK = 64 * 1024;
const tipoOK = m => /^image\/(jpeg|png|gif|webp)$/.test(m) || m === 'application/pdf' || /^audio\//.test(m);
const kb = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
const recibiendo = new Map();   // peer|id -> {name, mime, size, parts, got, d}

function etiqueta(name, mime) {
  if (/^image\//.test(mime)) return '📷 ' + name;
  if (/^audio\//.test(mime)) return (name.startsWith('nota-de-voz') ? '🎤 Nota de voz' : '🎵 ' + name);
  return '📄 ' + name;
}
// Contenido que se ve dentro del mensaje: foto, reproductor o botón de descarga
function vistaArchivo(blob, name, mime) {
  const url = URL.createObjectURL(blob);
  if (/^image\//.test(mime)) {
    const img = document.createElement('img'); img.src = url; img.alt = name;
    img.onclick = () => window.open(url, '_blank');
    img.onload = () => { el.msgs.scrollTop = el.msgs.scrollHeight; };
    return img;
  }
  if (/^audio\//.test(mime)) { const a = document.createElement('audio'); a.controls = true; a.src = url; return a; }
  const a = document.createElement('a'); a.className = 'arch'; a.href = url; a.download = name;
  a.textContent = '⬇ Descargar (' + kb(blob.size) + ')';
  return a;
}
// Reducir fotos grandes antes de enviarlas (máx. 1600 px, JPEG)
async function reducir(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    if (k === 1 && file.size < 1.5 * 1048576) return file;
    const cv = document.createElement('canvas');
    cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    const b = await new Promise(r => cv.toBlob(r, 'image/jpeg', .85));
    if (!b || b.size >= file.size) return file;
    return new File([b], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch (_) { return file; }
}
const espera = ms => new Promise(r => setTimeout(r, ms));
async function enviarArchivo(file) {
  if (!file) return;
  const mime = file.type || '';
  if (!tipoOK(mime)) { sistema('Solo se pueden enviar fotos, PDF y audio.'); return; }
  file = await reducir(file);
  if (file.size > MAX_FILE) { sistema('El archivo pasa de 10 MB (' + kb(file.size) + ').'); return; }
  const dest = [...conns.values()].filter(e => e.ok && e.conn.open);
  const name = String(file.name || 'archivo').slice(0, 80), type = file.type;
  const lbl = etiqueta(name, type);
  const prog = document.createElement('div'); prog.className = 'prog';
  const d = pintar({ from: nick, text: lbl, ts: Date.now(), yo: true, color: ajustes.color }, prog);
  anadir({ from: nick, text: lbl, ts: Date.now(), yo: true, color: ajustes.color }, 'solo');
  if (!dest.length) { prog.textContent = 'No hay nadie conectado: no se ha entregado'; d.append(vistaArchivo(file, name, type)); return; }
  const buf = await file.arrayBuffer(), id = Math.random().toString(36).slice(2, 10), total = Math.ceil(buf.byteLength / CHUNK) || 1;
  for (const e of dest) e.conn.send({ t: 'f0', id, name, mime: type, size: buf.byteLength, color: ajustes.color });
  for (let k = 0; k < total; k++) {
    const part = buf.slice(k * CHUNK, (k + 1) * CHUNK);
    for (const e of dest) {
      if (!e.conn.open) continue;
      e.conn.send({ t: 'fc', id, k, data: part });
      const dc = e.conn.dataChannel;
      while (dc && dc.bufferedAmount > 1048576 && e.conn.open) await espera(30);   // no saturar la conexión
    }
    prog.textContent = 'Enviando… ' + Math.round((k + 1) / total * 100) + ' %';
  }
  for (const e of dest) if (e.conn.open) e.conn.send({ t: 'f1', id });
  prog.remove();
  d.append(vistaArchivo(file, name, type));
  el.msgs.scrollTop = el.msgs.scrollHeight;
}
function recibirArchivo(c, e, d) {
  const key = c.peer + '|' + String(d.id || '');
  if (d.t === 'f0') {
    const mime = String(d.mime || ''), size = +d.size || 0;
    if (!tipoOK(mime) || size <= 0 || size > MAX_FILE) return;   // se ignora lo que no esté permitido
    const name = String(d.name || 'archivo').slice(0, 80).replace(/[\\/]/g, '_');
    const prog = document.createElement('div'); prog.className = 'prog'; prog.textContent = 'Recibiendo… 0 %';
    const lbl = etiqueta(name, mime);
    const box = pintar({ from: e.nick, color: colorValido(d.color) || e.color, text: lbl, ts: Date.now() }, prog);
    anadir({ from: e.nick, color: colorValido(d.color) || e.color, text: lbl, ts: Date.now() }, 'solo');
    recibiendo.set(key, { name, mime, size, parts: [], got: 0, box, prog });
    avisar();
    return;
  }
  const r = recibiendo.get(key); if (!r) return;
  if (d.t === 'fc') {
    const data = d.data;
    if (!(data instanceof ArrayBuffer) || !Number.isInteger(d.k)) return;
    r.parts[d.k] = data; r.got += data.byteLength;
    if (r.got > r.size) { recibiendo.delete(key); r.prog.textContent = 'Archivo no válido'; return; }
    r.prog.textContent = 'Recibiendo… ' + Math.round(r.got / r.size * 100) + ' %';
    return;
  }
  // f1: completo
  recibiendo.delete(key);
  if (r.got !== r.size) { r.prog.textContent = 'No ha llegado completo'; return; }
  const blob = new Blob(r.parts, { type: r.mime });
  r.prog.remove(); r.box.append(vistaArchivo(blob, r.name, r.mime));
  el.msgs.scrollTop = el.msgs.scrollHeight;
}

// Nota de voz: mantener pulsado 🎤, soltar para enviar (máx. 60 s)
let rec = null;
async function micDown(ev) {
  ev.preventDefault();
  if (rec) return;
  if (!navigator.mediaDevices || !window.MediaRecorder) { sistema('Este navegador no permite grabar notas de voz.'); return; }
  rec = { parts: [], t0: Date.now(), soltado: false };
  const yo = rec;
  try {
    const st = await navigator.mediaDevices.getUserMedia({ audio: true });
    if (yo.soltado || rec !== yo) { st.getTracks().forEach(t => t.stop()); rec = null; return; }
    const mt = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/ogg;codecs=opus', ''].find(m => !m || MediaRecorder.isTypeSupported(m));
    const mr = new MediaRecorder(st, mt ? { mimeType: mt } : undefined);
    yo.mr = mr; yo.st = st;
    mr.ondataavailable = e => { if (e.data.size) yo.parts.push(e.data); };
    mr.onstop = () => {
      st.getTracks().forEach(t => t.stop());
      clearInterval(yo.tick); el.mic.classList.remove('rec'); el.mic.textContent = '🎤';
      if (rec === yo) rec = null;
      const dur = Date.now() - yo.t0;
      if (dur < 600 || !yo.parts.length) { sistema('Mantén pulsado 🎤 mientras hablas.'); return; }
      const type = (mr.mimeType || 'audio/webm').split(';')[0];
      const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
      enviarArchivo(new File(yo.parts, 'nota-de-voz-' + Math.round(dur / 1000) + 's.' + ext, { type }));
    };
    mr.start(250);
    el.mic.classList.add('rec');
    yo.tick = setInterval(() => {
      const s = Math.floor((Date.now() - yo.t0) / 1000);
      el.mic.textContent = '⏺ ' + s + 's';
      if (s >= 60) micUp();
    }, 250);
  } catch (_) { rec = null; sistema('No hay permiso para usar el micrófono.'); }
}
function micUp() {
  if (!rec) return;
  rec.soltado = true;
  if (rec.mr && rec.mr.state !== 'inactive') rec.mr.stop();
}

// ---------- Eventos ----------
el.entrar.onclick = entrar;
el.frase.addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
el.enviar.onclick = enviar;
el.txt.addEventListener('keydown', e => { if (e.key === 'Enter') enviar(); });
el.flotar.onclick = flotar;
const fileIn = $('file'), micBtn = $('mic');
el.mic = micBtn;
$('clip').onclick = () => fileIn.click();
fileIn.onchange = () => { const f = fileIn.files[0]; fileIn.value = ''; enviarArchivo(f); };
micBtn.addEventListener('pointerdown', micDown);
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => micBtn.addEventListener(t, micUp));
micBtn.addEventListener('contextmenu', e => e.preventDefault());
el.salir.onclick = salir;
window.addEventListener('beforeunload', () => { if (peer) peer.destroy(); });

// Rellenar datos guardados (entrar sigue requiriendo un clic, para poder flotar y sonar)
el.nick.value = localStorage.getItem('ca_nick') || '';
el.frase.value = localStorage.getItem('ca_frase') || '';

// ---------- Ajustes: letra, color y tema ----------
const COLORES = ['#2f6fde','#d64545','#2e9e5b','#e08a1e','#8e4fd6','#d14f9a','#1fa3a3','#6b7280'];
const TEMAS = {
  'Oscuro': { bg:'#15171c', fg:'#e8e8e8', panel:'#22252d', borde:'#3a3f4b', otro:'#272b34', muted:'#99a3ad' },
  'Claro':  { bg:'#f4f5f7', fg:'#1d1f24', panel:'#ffffff', borde:'#cfd3da', otro:'#e4e7ec', muted:'#666e7a' },
  'Noche':  { bg:'#0f1a2e', fg:'#e3ecff', panel:'#18263f', borde:'#2b3d5e', otro:'#1c2c48', muted:'#8ea3c4' },
  'Verde':  { bg:'#1b261d', fg:'#e9f1e6', panel:'#243326', borde:'#3a4f3c', otro:'#2a3a2c', muted:'#9fb39f' }
};
function colorValido(c) { return /^#[0-9a-f]{6}$/i.test(c || '') ? c : null; }
const ajustes = {
  fs: +localStorage.getItem('ca_fs') || 15,
  color: colorValido(localStorage.getItem('ca_color')) || COLORES[0],
  tema: TEMAS[localStorage.getItem('ca_tema')] ? localStorage.getItem('ca_tema') : 'Oscuro'
};
function guardarAjustes() {
  localStorage.setItem('ca_fs', ajustes.fs);
  localStorage.setItem('ca_color', ajustes.color);
  localStorage.setItem('ca_tema', ajustes.tema);
}
function aplicarAjustes() {
  const t = TEMAS[ajustes.tema];
  for (const doc of [document, pipWin && pipWin.document]) {
    if (!doc) continue;
    const st = doc.documentElement.style;
    for (const k in t) st.setProperty('--' + k, t[k]);
    st.setProperty('--fs', ajustes.fs + 'px');
  }
  el.fs.value = ajustes.fs;
  el.fsVal.textContent = ajustes.fs + ' px';
  el.colores.querySelectorAll('.muestra').forEach(b => b.classList.toggle('sel', b.dataset.c === ajustes.color));
  el.temas.querySelectorAll('.tema').forEach(b => b.classList.toggle('sel', b.dataset.t === ajustes.tema));
}
function cambiar(k, v) {
  ajustes[k] = v;
  guardarAjustes();
  aplicarAjustes();
  if (k === 'color') {
    // Repintar mis mensajes con el color nuevo
    el.msgs.querySelectorAll('.m.yo').forEach(d => d.style.background = v);
  }
}
COLORES.forEach(c => {
  const b = document.createElement('button');
  b.className = 'muestra'; b.dataset.c = c; b.style.background = c; b.title = c;
  b.onclick = () => cambiar('color', c);
  el.colores.append(b);
});
Object.keys(TEMAS).forEach(n => {
  const b = document.createElement('button');
  b.className = 'tema'; b.dataset.t = n; b.textContent = n;
  const t = TEMAS[n]; b.style.background = t.bg; b.style.color = t.fg;
  b.onclick = () => cambiar('tema', n);
  el.temas.append(b);
});
el.fs.oninput = () => cambiar('fs', +el.fs.value);
el.ajustesBtn.onclick = () => el.ajustes.classList.toggle('abierto');
aplicarAjustes();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
